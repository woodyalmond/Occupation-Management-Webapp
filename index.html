<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alarmapp">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- iOS PWA 관련 메타 태그 추가 -->
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>alarmapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 오디오 요소 미리 생성 -->
  <audio id="beep-sound" preload="auto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" style="display:none"></audio>
  
  <!-- 간소화된 오디오 시스템 -->
  <script>
    // 전역 변수
    let audioCtx = null;
    let gainNode = null;
    let wakeLock = null;
    let timerWorker = null;
    let beepAudio = null;
    let swRegistration = null;
    
    // 타이머 상태
    let timerState = {
      isRunning: false,
      startTime: 0,
      duration: 0,
      remainingTime: 0
    };
    
    // 문서 로드 완료 시 실행
    document.addEventListener('DOMContentLoaded', function() {
      console.log("문서 로드 완료");
      
      // 오디오 요소 참조
      beepAudio = document.getElementById('beep-sound');
      
      // 사용자 상호작용 이벤트 리스너 등록
      const events = ['touchstart', 'mousedown', 'keydown'];
      events.forEach(event => {
        document.body.addEventListener(event, initAudio, { once: false });
      });
      
      // 백그라운드 타이머 초기화
      initBackgroundTimer();
      
      // 페이지 가시성 변경 이벤트 처리
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          console.log("페이지 보임");
          initAudio();
        } else {
          console.log("페이지 숨겨짐");
        }
      });
      
      // 서비스 워커 등록
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(function(registration) {
            console.log('서비스 워커 등록 성공:', registration.scope);
            swRegistration = registration;
            
            // 푸시 알림 권한 요청
            requestNotificationPermission();
          })
          .catch(function(error) {
            console.error('서비스 워커 등록 실패:', error);
          });
      }
    });
    
    // 오디오 초기화 (사용자 상호작용 필요)
    function initAudio() {
      console.log("오디오 초기화 시도");
      
      // 이미 초기화되었는지 확인
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          try {
            audioCtx.resume();
            console.log("오디오 컨텍스트 재개 시도");
          } catch (err) {
            console.error("오디오 컨텍스트 재개 실패:", err);
          }
        }
        return;
      }
      
      try {
        // 오디오 컨텍스트 생성
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log("오디오 컨텍스트 생성됨:", audioCtx.state);
        
        // 게인 노드 생성
        gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);
        
        // 무음 소리로 오디오 시스템 잠금 해제
        const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = silentBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        
        // Wake Lock 요청 (가능한 경우)
        requestWakeLock();
        
        console.log("오디오 초기화 완료");
      } catch (err) {
        console.error("오디오 초기화 실패:", err);
      }
    }
    
    // Wake Lock 요청 (화면 꺼짐 방지)
    function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          // 기존 wakeLock 해제
          if (wakeLock) {
            try {
              wakeLock.release();
            } catch (err) {
              console.error("기존 Wake Lock 해제 실패:", err);
            }
          }
          
          // 새 wakeLock 요청 (동기적 방식으로 변경)
          navigator.wakeLock.request('screen')
            .then(function(lock) {
              wakeLock = lock;
              console.log("Wake Lock 획득 성공");
              
              // 해제 이벤트 처리
              wakeLock.addEventListener('release', () => {
                console.log("Wake Lock 해제됨");
                
                // 타이머가 실행 중이면 다시 요청
                if (timerState.isRunning) {
                  setTimeout(requestWakeLock, 1000);
                }
              });
            })
            .catch(function(err) {
              console.error("Wake Lock 요청 실패:", err);
            });
        } catch (err) {
          console.error("Wake Lock API 오류:", err);
        }
      } else {
        console.log("Wake Lock API 지원되지 않음");
      }
    }
    
    // 비프음 재생 (Web Audio API 사용)
    function playBeep() {
      console.log("비프음 재생 시도");
      
      // 진동 API 사용 (가능한 경우)
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
        console.log("진동 활성화");
      }
      
      // 오디오 컨텍스트 확인
      if (!audioCtx) {
        initAudio();
        
        // 초기화 후에도 없으면 실패
        if (!audioCtx) {
          console.error("오디오 컨텍스트 없음");
          return false;
        }
      }
      
      // 오디오 컨텍스트 상태 확인
      if (audioCtx.state === 'suspended') {
        try {
          audioCtx.resume();
        } catch (err) {
          console.error("오디오 컨텍스트 재개 실패:", err);
        }
      }
      
      try {
        // 첫 번째 비프음 생성
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'square';
        osc1.frequency.value = 800;
        
        // 게인 노드 설정
        gainNode.gain.value = 0.5;
        
        // 연결 및 재생
        osc1.connect(gainNode);
        osc1.start();
        
        // 첫 번째 비프음 정지 및 두 번째 비프음 재생
        setTimeout(() => {
          osc1.stop();
          
          // 두 번째 비프음
          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.value = 600;
            osc2.connect(gainNode);
            osc2.start();
            
            setTimeout(() => {
              osc2.stop();
            }, 200);
          }, 200);
        }, 200);
        
        console.log("비프음 재생 성공");
        return true;
      } catch (err) {
        console.error("비프음 재생 실패:", err);
        
        // 대체 방법: HTML Audio 요소 사용
        try {
          beepAudio.currentTime = 0;
          beepAudio.play();
          console.log("대체 오디오 재생");
        } catch (audioErr) {
          console.error("대체 오디오 재생 실패:", audioErr);
        }
        
        return false;
      }
    }
    
    // 백그라운드 타이머 초기화
    function initBackgroundTimer() {
      console.log("백그라운드 타이머 초기화");
      
      // 워커 코드
      const workerCode = `
        // 타이머 변수
        let timerId = null;
        let startTime = 0;
        let duration = 0;
        let isRunning = false;
        
        // 메시지 처리
        self.onmessage = function(e) {
          const data = e.data;
          
          switch(data.action) {
            case 'start':
              // 타이머 시작
              startTime = Date.now();
              duration = data.duration * 1000;
              isRunning = true;
              
              // 이전 타이머 정리
              if (timerId) clearInterval(timerId);
              
              // 새 타이머 시작
              timerId = setInterval(() => {
                if (!isRunning) return;
                
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = Math.max(0, duration - elapsed);
                
                // 메인 스레드에 상태 전송
                self.postMessage({
                  type: 'tick',
                  remainingTime: Math.ceil(remaining / 1000)
                });
                
                // 타이머 완료 확인
                if (remaining <= 0) {
                  clearInterval(timerId);
                  timerId = null;
                  isRunning = false;
                  self.postMessage({ type: 'complete' });
                }
              }, 500);
              break;
              
            case 'stop':
              // 타이머 중지
              isRunning = false;
              if (timerId) {
                clearInterval(timerId);
                timerId = null;
              }
              break;
              
            case 'get_state':
              // 상태 반환
              if (isRunning) {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = Math.max(0, duration - elapsed);
                self.postMessage({
                  type: 'state',
                  isRunning: true,
                  remainingTime: Math.ceil(remaining / 1000)
                });
              } else {
                self.postMessage({
                  type: 'state',
                  isRunning: false,
                  remainingTime: 0
                });
              }
              break;
          }
        };
        
        // 주기적 상태 확인 (백그라운드 작동 보장)
        setInterval(() => {
          if (isRunning) {
            const now = Date.now();
            const elapsed = now - startTime;
            const remaining = Math.max(0, duration - elapsed);
            
            if (remaining <= 0) {
              clearInterval(timerId);
              timerId = null;
              isRunning = false;
              self.postMessage({ type: 'complete' });
            }
          }
        }, 1000);
      `;
      
      try {
        // 워커 생성
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        timerWorker = new Worker(workerUrl);
        
        // 메시지 처리
        timerWorker.onmessage = function(e) {
          const data = e.data;
          
          switch(data.type) {
            case 'tick':
              // 타이머 틱
              timerState.remainingTime = data.remainingTime;
              
              // Flutter에 알림 (가능한 경우)
              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('onTimerTick', data.remainingTime);
              }
              break;
              
            case 'complete':
              // 타이머 완료
              timerState.isRunning = false;
              timerState.remainingTime = 0;
              
              // 알람 소리 재생
              playBeep();
              
              // Flutter에 알림 (가능한 경우)
              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('onTimerComplete');
              }
              break;
              
            case 'state':
              // 상태 업데이트
              timerState.isRunning = data.isRunning;
              timerState.remainingTime = data.remainingTime;
              break;
          }
        };
        
        console.log("백그라운드 타이머 초기화 완료");
      } catch (err) {
        console.error("백그라운드 타이머 초기화 실패:", err);
      }
    }
    
    // Flutter에서 호출할 함수들
    
    // 타이머 시작
    window.startBackgroundTimer = function(durationSeconds) {
      console.log("타이머 시작:", durationSeconds);
      
      if (!timerWorker) {
        console.error("타이머 워커 없음");
        return false;
      }
      
      // 타이머 상태 업데이트
      timerState.isRunning = true;
      timerState.duration = durationSeconds;
      timerState.startTime = Date.now();
      timerState.remainingTime = durationSeconds;
      
      // 워커에 시작 메시지 전송
      timerWorker.postMessage({
        action: 'start',
        duration: durationSeconds
      });
      
      // Wake Lock 요청
      requestWakeLock();
      
      // 오디오 초기화
      initAudio();
      
      return true;
    };
    
    // 타이머 중지
    window.stopBackgroundTimer = function() {
      console.log("타이머 중지");
      
      if (!timerWorker) {
        console.error("타이머 워커 없음");
        return false;
      }
      
      // 타이머 상태 업데이트
      timerState.isRunning = false;
      
      // 워커에 중지 메시지 전송
      timerWorker.postMessage({ action: 'stop' });
      
      // Wake Lock 해제
      if (wakeLock) {
        try {
          wakeLock.release();
        } catch (err) {
          console.error("Wake Lock 해제 실패:", err);
        }
        wakeLock = null;
      }
      
      return true;
    };
    
    // 타이머 상태 가져오기
    window.getTimerState = function() {
      if (!timerWorker) {
        return { isRunning: false, remainingTime: 0 };
      }
      
      // 워커에 상태 요청
      timerWorker.postMessage({ action: 'get_state' });
      
      // 현재 상태 반환
      return {
        isRunning: timerState.isRunning,
        remainingTime: timerState.remainingTime
      };
    };
    
    // 알람 소리 재생
    window.playAlarmSound = function() {
      console.log("알람 소리 재생");
      
      // 오디오 초기화 확인
      if (!audioCtx) {
        try {
          initAudio();
        } catch (e) {
          console.error("오디오 초기화 실패:", e);
        }
      }
      
      // 푸시 알림 표시
      showNotification();
      
      return playBeep();
    };
    
    // 푸시 알림 권한 요청
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        console.log('이 브라우저는 알림을 지원하지 않습니다.');
        return;
      }
      
      if (Notification.permission === 'granted') {
        console.log('알림 권한이 이미 허용되었습니다.');
        return;
      }
      
      if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            console.log('알림 권한이 허용되었습니다.');
            
            // 구독 설정
            subscribePushNotification();
          }
        });
      }
    }
    
    // 푸시 알림 구독
    function subscribePushNotification() {
      if (!swRegistration) {
        console.error('서비스 워커가 등록되지 않았습니다.');
        return;
      }
      
      // VAPID 키 (실제 사용 시 서버에서 생성한 공개 키로 대체)
      const applicationServerPublicKey = 
        'BLBx-hf2WrL2qEa0qKb-aCJbcxEvyn56-Yt0Fp1CkjwTATYVBXY0ZCKv2lL4VU1xfpTWLTjLVUx9x1ZdBPKVzWo';
      
      const applicationServerKey = urlB64ToUint8Array(applicationServerPublicKey);
      
      swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      })
      .then(function(subscription) {
        console.log('푸시 알림 구독 성공:', JSON.stringify(subscription));
        // 여기서 구독 정보를 서버에 전송하는 코드 추가
      })
      .catch(function(error) {
        console.error('푸시 알림 구독 실패:', error);
      });
    }
    
    // Base64 URL을 Uint8Array로 변환
    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');
        
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      
      return outputArray;
    }
    
    // 알림 표시
    function showNotification() {
      if (!('Notification' in window)) {
        console.log('이 브라우저는 알림을 지원하지 않습니다.');
        return;
      }
      
      if (Notification.permission === 'granted') {
        // 서비스 워커가 있으면 서비스 워커를 통해 알림 표시
        if (swRegistration) {
          const options = {
            body: '타이머가 완료되었습니다!',
            icon: 'icons/Icon-192.png',
            badge: 'icons/Icon-192.png',
            vibrate: [200, 100, 200, 100, 200],
            tag: 'alarm-notification',
            renotify: true,
            requireInteraction: true,
            actions: [
              {
                action: 'open',
                title: '앱 열기'
              },
              {
                action: 'close',
                title: '닫기'
              }
            ]
          };
          
          swRegistration.showNotification('알람 타이머', options);
        } else {
          // 서비스 워커가 없으면 일반 알림 표시
          const notification = new Notification('알람 타이머', {
            body: '타이머가 완료되었습니다!',
            icon: 'icons/Icon-192.png'
          });
          
          notification.onclick = function() {
            window.focus();
            notification.close();
          };
        }
      } else if (Notification.permission !== 'denied') {
        // 권한이 없으면 권한 요청
        requestNotificationPermission();
      }
    }
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
