<html>
<head>

  <base href="/alarmapp/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="알람 타이머">
  <meta name="apple-touch-fullscreen" content="yes">
  
  <!-- iOS 아이콘 -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  
  <!-- iOS 스플래시 화면 -->
  <link rel="apple-touch-startup-image" href="icons/splash.png">
  
  <!-- iOS PWA 관련 메타 태그 추가 -->
  <meta name="theme-color" content="#000000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- iOS 웹 푸시 알림 지원 -->
  <meta name="apple-mobile-web-app-title" content="알람앱">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>alarmapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 오디오 요소 미리 생성 -->
  <audio id="beep-sound" preload="auto" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" style="display:none"></audio>
  
  <!-- 간소화된 오디오 시스템 -->
  <script>
    // 전역 변수
    let audioCtx = null;
    let gainNode = null;
    let wakeLock = null;
    let timerWorker = null;
    let beepAudio = null;
    let swRegistration = null;
    
    // 타이머 상태
    let timerState = {
      isRunning: false,
      startTime: 0,
      duration: 0,
      remainingTime: 0
    };
    
    // 문서 로드 완료 시 실행
    document.addEventListener('DOMContentLoaded', function() {
      console.log("문서 로드 완료");
      
      // 오디오 요소 참조
      beepAudio = document.getElementById('beep-sound');
      
      // 사용자 상호작용 이벤트 리스너 등록
      const events = ['touchstart', 'mousedown', 'keydown'];
      events.forEach(event => {
        document.body.addEventListener(event, initAudio, { once: false });
      });
      
      // 백그라운드 타이머 초기화
      initBackgroundTimer();
      
      // 페이지 가시성 변경 이벤트 처리
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          console.log("페이지 보임");
          initAudio();
        } else {
          console.log("페이지 숨겨짐");
        }
      });
      
      // 서비스 워커 등록
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js')
            .then(function(registration) {
              console.log('서비스 워커 등록 성공:', registration.scope);
              swRegistration = registration;
              
              // 알림 권한 요청
              requestNotificationPermission();
            })
            .catch(function(error) {
              console.error('서비스 워커 등록 실패:', error);
            });
        });
      }
    });
    
    // 오디오 초기화 (사용자 상호작용 필요)
    function initAudio() {
      console.log("오디오 초기화 시도");
      
      // 이미 초기화되었는지 확인
      if (audioCtx) {
        if (audioCtx.state === 'suspended') {
          try {
            audioCtx.resume();
            console.log("오디오 컨텍스트 재개 시도");
          } catch (err) {
            console.error("오디오 컨텍스트 재개 실패:", err);
          }
        }
        return;
      }
      
      try {
        // 오디오 컨텍스트 생성
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        console.log("오디오 컨텍스트 생성됨:", audioCtx.state);
        
        // 게인 노드 생성
        gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);
        
        // 무음 소리로 오디오 시스템 잠금 해제
        const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = silentBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        
        // Wake Lock 요청 (가능한 경우)
        requestWakeLock();
        
        console.log("오디오 초기화 완료");
      } catch (err) {
        console.error("오디오 초기화 실패:", err);
      }
    }
    
    // Wake Lock 요청 (화면 꺼짐 방지)
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          // 기존 wakeLock 해제
          if (wakeLock) {
            try {
              wakeLock.release();
            } catch (err) {
              console.error("기존 Wake Lock 해제 실패:", err);
            }
          }
          
          // 새 wakeLock 요청 (동기적 방식으로 변경)
          wakeLock = await navigator.wakeLock.request('screen');
          console.log("Wake Lock 획득 성공");
          
          // 해제 이벤트 처리
          wakeLock.addEventListener('release', () => {
            console.log("Wake Lock 해제됨");
            
            // 타이머가 실행 중이면 다시 요청
            if (timerState.isRunning) {
              setTimeout(requestWakeLock, 1000);
            }
          });
        } catch (err) {
          console.error("Wake Lock 요청 실패:", err);
        }
      } else {
        console.log("Wake Lock API 지원되지 않음");
      }
    }
    
    // 비프음 재생 (Web Audio API 사용)
    function playBeep() {
      console.log("비프음 재생 시도");
      
      // 진동 API 사용 (가능한 경우)
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
        console.log("진동 활성화");
      }
      
      // 오디오 컨텍스트 확인
      if (!audioCtx) {
        initAudio();
        
        // 초기화 후에도 없으면 실패
        if (!audioCtx) {
          console.error("오디오 컨텍스트 없음");
          return false;
        }
      }
      
      // 오디오 컨텍스트 상태 확인
      if (audioCtx.state === 'suspended') {
        try {
          audioCtx.resume();
        } catch (err) {
          console.error("오디오 컨텍스트 재개 실패:", err);
        }
      }
      
      try {
        // 첫 번째 비프음 생성
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'square';
        osc1.frequency.value = 800;
        
        // 게인 노드 설정
        gainNode.gain.value = 0.5;
        
        // 연결 및 재생
        osc1.connect(gainNode);
        osc1.start();
        
        // 첫 번째 비프음 정지 및 두 번째 비프음 재생
        setTimeout(() => {
          osc1.stop();
          
          // 두 번째 비프음
          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.value = 600;
            osc2.connect(gainNode);
            osc2.start();
            
            setTimeout(() => {
              osc2.stop();
            }, 200);
          }, 200);
        }, 200);
        
        console.log("비프음 재생 성공");
        return true;
      } catch (err) {
        console.error("비프음 재생 실패:", err);
        
        // 대체 방법: HTML Audio 요소 사용
        try {
          beepAudio.currentTime = 0;
          beepAudio.play();
          console.log("대체 오디오 재생");
        } catch (audioErr) {
          console.error("대체 오디오 재생 실패:", audioErr);
        }
        
        return false;
      }
    }
    
    // 백그라운드 타이머 초기화
    function initBackgroundTimer() {
      console.log("백그라운드 타이머 초기화");
      
      // 워커 코드
      const workerCode = `
        // 타이머 변수
        let timerId = null;
        let startTime = 0;
        let duration = 0;
        let isRunning = false;
        
        // 메시지 처리
        self.onmessage = function(e) {
          const data = e.data;
          
          switch(data.action) {
            case 'start':
              // 타이머 시작
              startTime = Date.now();
              duration = data.duration * 1000;
              isRunning = true;
              
              // 이전 타이머 정리
              if (timerId) clearInterval(timerId);
              
              // 새 타이머 시작
              timerId = setInterval(() => {
                if (!isRunning) return;
                
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = Math.max(0, duration - elapsed);
                
                // 메인 스레드에 상태 전송
                self.postMessage({
                  type: 'tick',
                  remainingTime: Math.ceil(remaining / 1000)
                });
                
                // 타이머 완료 확인
                if (remaining <= 0) {
                  clearInterval(timerId);
                  timerId = null;
                  isRunning = false;
                  self.postMessage({ type: 'complete' });
                }
              }, 500);
              break;
              
            case 'stop':
              // 타이머 중지
              isRunning = false;
              if (timerId) {
                clearInterval(timerId);
                timerId = null;
              }
              break;
              
            case 'get_state':
              // 상태 반환
              if (isRunning) {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = Math.max(0, duration - elapsed);
                self.postMessage({
                  type: 'state',
                  isRunning: true,
                  remainingTime: Math.ceil(remaining / 1000)
                });
              } else {
                self.postMessage({
                  type: 'state',
                  isRunning: false,
                  remainingTime: 0
                });
              }
              break;
          }
        };
        
        // 주기적 상태 확인 (백그라운드 작동 보장)
        setInterval(() => {
          if (isRunning) {
            const now = Date.now();
            const elapsed = now - startTime;
            const remaining = Math.max(0, duration - elapsed);
            
            if (remaining <= 0) {
              clearInterval(timerId);
              timerId = null;
              isRunning = false;
              self.postMessage({ type: 'complete' });
            }
          }
        }, 1000);
      `;
      
      try {
        // 워커 생성
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        timerWorker = new Worker(workerUrl);
        
        // 메시지 처리
        timerWorker.onmessage = function(e) {
          const data = e.data;
          
          switch(data.type) {
            case 'tick':
              // 타이머 틱
              timerState.remainingTime = data.remainingTime;
              
              // Flutter에 알림 (가능한 경우)
              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('onTimerTick', data.remainingTime);
              }
              break;
              
            case 'complete':
              // 타이머 완료
              timerState.isRunning = false;
              timerState.remainingTime = 0;
              
              // 알람 소리 재생
              playBeep();
              
              // Flutter에 알림 (가능한 경우)
              if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('onTimerComplete');
              }
              break;
              
            case 'state':
              // 상태 업데이트
              timerState.isRunning = data.isRunning;
              timerState.remainingTime = data.remainingTime;
              break;
          }
        };
        
        console.log("백그라운드 타이머 초기화 완료");
      } catch (err) {
        console.error("백그라운드 타이머 초기화 실패:", err);
      }
    }
    
    // Flutter에서 호출할 함수들
    
    // 타이머 시작
    window.startBackgroundTimer = function(durationSeconds) {
      console.log("타이머 시작:", durationSeconds);
      
      if (!timerWorker) {
        console.error("타이머 워커 없음");
        return false;
      }
      
      // 타이머 상태 업데이트
      timerState.isRunning = true;
      timerState.duration = durationSeconds;
      timerState.startTime = Date.now();
      timerState.remainingTime = durationSeconds;
      
      // 워커에 시작 메시지 전송
      timerWorker.postMessage({
        action: 'start',
        duration: durationSeconds
      });
      
      // Wake Lock 요청
      requestWakeLock();
      
      // 오디오 초기화
      initAudio();
      
      return true;
    };
    
    // 타이머 중지
    window.stopBackgroundTimer = function() {
      console.log("타이머 중지");
      
      if (!timerWorker) {
        console.error("타이머 워커 없음");
        return false;
      }
      
      // 타이머 상태 업데이트
      timerState.isRunning = false;
      
      // 워커에 중지 메시지 전송
      timerWorker.postMessage({ action: 'stop' });
      
      // Wake Lock 해제
      if (wakeLock) {
        try {
          wakeLock.release();
        } catch (err) {
          console.error("Wake Lock 해제 실패:", err);
        }
        wakeLock = null;
      }
      
      return true;
    };
    
    // 타이머 상태 가져오기
    window.getTimerState = function() {
      if (!timerWorker) {
        return { isRunning: false, remainingTime: 0 };
      }
      
      // 워커에 상태 요청
      timerWorker.postMessage({ action: 'get_state' });
      
      // 현재 상태 반환
      return {
        isRunning: timerState.isRunning,
        remainingTime: timerState.remainingTime
      };
    };
    
    // 알람 소리 재생
    window.playAlarmSound = function() {
      console.log("알람 소리 재생");
      
      // 오디오 초기화 확인
      if (!audioCtx) {
        try {
          initAudio();
        } catch (e) {
          console.error("오디오 초기화 실패:", e);
        }
      }
      
      // 화면 깨우기 시도
      if (wakeLock === null && 'wakeLock' in navigator) {
        requestWakeLock().catch(e => console.error('알람 시 웨이크락 요청 실패:', e));
      }
      
      // 모든 기기에서 강화된 진동 실행
      vibrateDevice([500, 100, 500, 100, 500, 100, 500, 100, 500]);
      
      // iOS에서 로컬 알림 표시 (Service Worker 대체)
      if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
        // iOS 로컬 알림 (홈 화면에 추가된 앱에서만 작동)
        if (window.Notification && Notification.permission === 'granted') {
          try {
            // 일반 알림 사용 (iOS PWA에서 지원)
            const notification = new Notification('알람 타이머', {
              body: '타이머가 완료되었습니다!',
              icon: 'icons/Icon-192.png',
              badge: 'icons/Icon-192.png',
              tag: 'alarm-notification',
              renotify: true
            });
            
            // 알림 클릭 시 앱 포커스
            notification.onclick = function() {
              window.focus();
              notification.close();
            };
            
            console.log("iOS 로컬 알림 표시됨");
          } catch (e) {
            console.error("iOS 알림 오류:", e);
            
            // 오류 발생 시 대체 방법으로 알림 표시
            try {
              alert('타이머가 완료되었습니다!');
            } catch (alertError) {
              console.error("대체 알림 표시 실패:", alertError);
            }
          }
        } else {
          console.log("iOS 알림 권한이 없습니다. 권한 요청 중...");
          requestNotificationPermission();
          
          // 권한이 없는 경우 대체 방법으로 알림 표시
          try {
            alert('타이머가 완료되었습니다!');
          } catch (e) {
            console.error("iOS 대체 알림 표시 실패:", e);
          }
        }
        
        // iOS 오디오 재생 강제 시도 (무음 모드에서도 소리 재생)
        try {
          // 오디오 컨텍스트 상태 확인 및 재개
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          
          // 임시 오디오 요소 생성 및 재생
          const tempAudio = new Audio();
          tempAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
          tempAudio.play().catch(e => console.error("iOS 임시 오디오 재생 실패:", e));
          
          // 오디오 컨텍스트를 통한 직접 소리 재생
          const oscillator = audioCtx.createOscillator();
          oscillator.type = 'square';
          oscillator.frequency.value = 800;
          oscillator.connect(gainNode);
          oscillator.start();
          setTimeout(() => oscillator.stop(), 500);
          
          console.log("iOS 오디오 재생 시도");
        } catch (e) {
          console.error("iOS 오디오 재생 오류:", e);
        }
      }
      
      // 서비스 워커를 통한 알림 요청 (iOS 외 기기)
      if (swRegistration && !navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
        // 서비스 워커에 메시지 전송
        try {
          swRegistration.active.postMessage({
            type: 'SHOW_NOTIFICATION',
            message: '타이머가 완료되었습니다!'
          });
          console.log("서비스 워커에 알림 요청 전송됨");
        } catch (e) {
          console.error("서비스 워커 메시지 전송 실패:", e);
          // 실패 시 일반 알림 표시
          showNotification();
        }
      } else {
        // 서비스 워커가 없거나 iOS인 경우 일반 알림 표시
        showNotification();
      }
      
      // 오디오 재생 시도
      try {
        return playBeep();
      } catch (e) {
        console.error("오디오 재생 실패:", e);
        return false;
      }
    };
    
    // 알림 권한 요청
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        console.log('이 브라우저는 알림을 지원하지 않습니다.');
        return;
      }
      
      if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            console.log('알림 권한이 허용되었습니다.');
            
            // iOS에서는 권한 허용 후 즉시 테스트 알림 표시
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
              setTimeout(function() {
                try {
                  new Notification('알람 타이머 테스트', {
                    body: '알림이 정상적으로 작동합니다.',
                    icon: 'icons/Icon-192.png'
                  });
                  console.log("iOS 테스트 알림 표시됨");
                } catch (e) {
                  console.error("iOS 테스트 알림 오류:", e);
                }

      } else if (Notification.permission !== 'denied') {

    // 푸시 알림 권한 요청
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        console.log('이 브라우저는 알림을 지원하지 않습니다.');
        return;
      }
      
      if (Notification.permission === 'granted') {
        console.log('이미 알림 권한이 허용되어 있습니다.');
        return;
      }
      
      if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            console.log('알림 권한이 허용되었습니다.');
            
            // 구독 설정
            subscribePushNotification();
          }
        });
      }
    }
    
    // 푸시 알림 구독
    function subscribePushNotification() {
      if (!swRegistration) {
        console.error('서비스 워커가 등록되지 않았습니다.');
        return;
      }
      
      // VAPID 키 (실제 사용 시 서버에서 생성한 공개 키로 대체)
      const applicationServerPublicKey = 
        'BLBx-hf2WrL2qEa0qKb-aCJbcxEvyn56-Yt0Fp1CkjwTATYVBXY0ZCKv2lL4VU1xfpTWLTjLVUx9x1ZdBPKVzWo';
      
      const applicationServerKey = urlB64ToUint8Array(applicationServerPublicKey);
      
      swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: applicationServerKey
      })
      .then(function(subscription) {
        console.log('푸시 알림 구독 성공:', JSON.stringify(subscription));
        // 여기서 구독 정보를 서버에 전송하는 코드 추가
      })
      .catch(function(error) {
        console.error('푸시 알림 구독 실패:', error);
      });
    }
    
    // Base64 URL을 Uint8Array로 변환
    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');
        
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      
      return outputArray;
    }
    
    // iOS 홈 화면 추가 안내 표시
    function showIOSInstallPrompt() {
      // iOS 기기인지 확인
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (!isIOS) return;
      
      // 이미 홈 화면에 추가되었는지 확인
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (isStandalone) return;
      
      // 로컬 스토리지에서 안내 표시 여부 확인
      const promptShown = localStorage.getItem('iosInstallPromptShown');
      if (promptShown) return;
      
      // 안내 메시지 표시
      const message = 
        '알람 타이머 앱을 홈 화면에 추가하면 다음과 같은 이점이 있습니다:\n\n' +
        '• 전체 화면으로 사용 가능\n' +
        '• 알림 기능 사용 가능\n' +
        '• 오프라인에서도 작동\n\n' +
        '설치 방법: Safari 하단의 "공유" 버튼을 누른 후 "홈 화면에 추가"를 선택하세요.';
      
      alert(message);
      
      // 안내 표시 여부 저장 (24시간 동안 다시 표시하지 않음)
      localStorage.setItem('iosInstallPromptShown', new Date().getTime());
      
      // 24시간 후 안내 표시 여부 초기화
      setTimeout(() => {
        localStorage.removeItem('iosInstallPromptShown');
      }, 24 * 60 * 60 * 1000);
    }
    
    // iOS 타이머 완료 감지 및 알림 표시
    function setupIOSAlarmCheck() {
      // iOS 디바이스 확인
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (!isIOS) return;
      
      console.log("iOS 알람 체크 시스템 설정");
      
      // 로컬 스토리지에서 타이머 정보 확인
      setInterval(() => {
        try {
          // 로컬 스토리지에서 타이머 정보 읽기
          const timerData = localStorage.getItem('alarmTimerData');
          if (!timerData) return;
          
          const data = JSON.parse(timerData);
          if (!data.isRunning || !data.endTime) return;
          
          // 현재 시간과 종료 시간 비교
          const now = new Date().getTime();
          const endTime = data.endTime;
          
          // 타이머가 완료되었고 아직 알림을 표시하지 않았으면
          if (now >= endTime && data.isRunning) {
            console.log("iOS 타이머 완료 감지");
            
            // 타이머 상태 업데이트
            data.isRunning = false;
            localStorage.setItem('alarmTimerData', JSON.stringify(data));
            
            // 화면 깨우기 시도
            if (wakeLock === null && 'wakeLock' in navigator) {
              requestWakeLock().catch(e => console.error('타이머 완료 시 웨이크락 요청 실패:', e));
            }
            
            // 강화된 진동 실행
            vibrateDevice([500, 100, 500, 100, 500, 100, 500, 100, 500]);
            
            // 알람 재생
            playAlarmSound();
          }
        } catch (e) {
          console.error("iOS 타이머 체크 오류:", e);
        }
      }, 1000); // 1초마다 확인
    }
    
    // iOS 타이머 시작/중지 함수 개선
    window.startTimerWithDuration = function(durationInSeconds) {
      console.log("타이머 시작: " + durationInSeconds + "초");
      
      // iOS를 위한 로컬 스토리지 저장
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (isIOS) {
        try {
          const now = new Date().getTime();
          const endTime = now + (durationInSeconds * 1000);
          
          // 타이머 정보 저장
          const timerData = {
            isRunning: true,
            startTime: now,
            endTime: endTime,
            duration: durationInSeconds
          };
          
          localStorage.setItem('alarmTimerData', JSON.stringify(timerData));
          console.log("iOS 타이머 정보 저장됨");
          
          // 테스트 알림 표시
          if (Notification.permission === 'granted') {
            setTimeout(() => {
              try {
                new Notification('타이머 시작됨', {
                  body: `${durationInSeconds}초 타이머가 시작되었습니다.`,
                  icon: 'icons/Icon-192.png'
                });
              } catch (e) {
                console.error("iOS 테스트 알림 오류:", e);
              }
            }, 1000);
          }
        } catch (e) {
          console.error("iOS 타이머 정보 저장 오류:", e);
        }
      }
      
      // 기존 타이머 로직 호출
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('startTimer', durationInSeconds);
      }
    };
    
    // 타이머 중지 시 로컬 스토리지 정보 업데이트 (iOS용)
    window.stopTimer = function() {
      console.log("타이머 중지");
      
      // iOS를 위한 로컬 스토리지 업데이트
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (isIOS) {
        try {
          const timerData = localStorage.getItem('alarmTimerData');
          if (timerData) {
            const data = JSON.parse(timerData);
            data.isRunning = false;
            localStorage.setItem('alarmTimerData', JSON.stringify(data));
            console.log("iOS 타이머 정보 업데이트됨 (중지)");
          }
        } catch (e) {
          console.error("iOS 타이머 정보 업데이트 오류:", e);
        }
      }
      
      // 기존 타이머 중지 로직 호출
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('stopTimer');
      }
    };
    
    // 페이지 로드 시 iOS 타이머 체크 설정
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      window.addEventListener('load', setupIOSAlarmCheck);
    }
    
    // 페이지 로드 후 5초 후에 iOS 설치 안내 표시
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      setTimeout(showIOSInstallPrompt, 5000);
    }
    
    // 웨이크락 요청
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('웨이크락 획득 성공');
          
          // 해제 이벤트 리스너
          wakeLock.addEventListener('release', () => {
            console.log('웨이크락 해제됨');
            // 자동으로 다시 요청
            setTimeout(requestWakeLock, 1000);
          });
        } catch (e) {
          console.error('웨이크락 요청 실패:', e);
        }
      } else {
        console.log('웨이크락 API를 지원하지 않는 브라우저입니다.');
      }
    }
    
    // 강화된 진동 함수
    function vibrateDevice(pattern) {
      if ('vibrate' in navigator) {
        try {
          // 기본 진동 패턴
          const defaultPattern = [300, 100, 300, 100, 300, 100, 300, 100, 300];
          const vibrationPattern = pattern || defaultPattern;
          
          // 진동 실행
          navigator.vibrate(vibrationPattern);
          console.log('진동 실행:', vibrationPattern);
          
          // 진동이 끝난 후 다시 실행 (총 3회 반복)
          const totalDuration = vibrationPattern.reduce((a, b) => a + b, 0);
          
          // 첫 번째 반복
          setTimeout(() => {
            navigator.vibrate(vibrationPattern);
            console.log('진동 반복 1');
            
            // 두 번째 반복
            setTimeout(() => {
              navigator.vibrate(vibrationPattern);
              console.log('진동 반복 2');
            }, totalDuration + 500);
          }, totalDuration + 500);
        } catch (e) {
          console.error('진동 실행 실패:', e);
        }
      } else {
        console.log('이 기기는 진동 API를 지원하지 않습니다.');
      }
    }
